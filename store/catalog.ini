# NervusOS App Store catalog.
#
# One section per package. `file` names a .nspkg in packages/ next to this file
# (on the device: /usr/share/nervus/store/packages/). `launch` is the app
# component the store's Open button starts (default: main).
# scripts/build.sh copies this file to out/store/ and checks every file exists.

[com.nervus.robotarm]
name = Robot Arm
file = com.nervus.robotarm-1.0.0.nspkg
version = 1.0.0
version_code = 1
category = Robotics
publisher = NervusOS Cambridge
launch = main
summary = Drive the AgileX PiPER arm: per-joint sliders, Cartesian jog, gripper, home and e-stop.
description = Talks to the PiPER driver that NervusOS runs on can0 (loopback port 8770). The motors stay disabled until you press Enable. If the app stops sending its heartbeat for 1.5 s, the driver stops streaming commands and the arm halts. Use Recover after a collision fault and E-Stop at any time.

[com.nervus.handteleop]
name = Hand Teleop
file = com.nervus.handteleop-1.1.0.nspkg
version = 1.1.0
version_code = 3
category = Robotics
publisher = NervusOS Cambridge
launch = main
summary = Drive the PiPER with your hand: the laptop camera tracks your hand in metres, your wrist roll turns the gripper, and a pinch works it.
description = YOLO26 pose and MediaPipe hand landmarks run on the laptop CPU at camera rate and draw a live skeleton over your video. Press Engage and the arm follows your hand in metric depth: the hand's distance comes from its own palm bones, so tilting your palm no longer moves the arm, and moving toward the camera reaches forward. Rolling your wrist turns the gripper about its own axis (on, off or inverted), and a 3-D pinch of thumb and index, or thumb against all four fingers, works the gripper. Frames where tracking jumps are skipped, and at the edge of the workspace the arm follows as soon as you turn back. Everything goes through NervusOS: frames come from the camera service, and arm commands go through the kernel under a control lease, so it asks for camera and arm permission when you install it.

[com.nervus.act]
name = ACT Studio
file = com.nervus.act-1.0.1.nspkg
version = 1.0.1
version_code = 2
category = Robotics
publisher = NervusOS Cambridge
launch = main
summary = Teach the PiPER by demonstration, train on the Mac, run what it learned, correct it, and let it improve.
description = Records drag-taught demonstrations from the wrist and scene cameras into LeRobot datasets, lets you trim and exclude takes, and sends training jobs to the Mac over the shared folder (directly on the same network, through the server relay otherwise). Runs any published policy with the safeguards learned on the real arm, records your corrections when it fails, and post-trains on them; a candidate replaces the current policy only after it wins real runs. It works through the ACT engine that NervusOS runs, so it asks for camera and arm permission when you install it.

[com.nervus.llmarm]
name = LLM Arm
file = com.nervus.llmarm-1.0.0.nspkg
version = 1.0.0
version_code = 1
category = Robotics
publisher = NervusOS Cambridge
launch = main
summary = Tell the PiPER arm what to do in plain language; DeepSeek or GPT looks through the cameras and plans.
description = Type a request such as "put the red block on the blue one". A vision model (DeepSeek or OpenAI GPT, switchable) sees the scene and wrist cameras and plans with a few tools: pick, place, move, gripper. The LLM Arm service checks every step against the workspace and the table, moves the arm in slow straight lines, and by default waits for you to approve each move. STOP and E-STOP are always on screen. Needs an API key in ~/.config/nervus (deepseek.key or openai.key, mode 600).

[com.example.hello]
name = Nervus Hello World
file = com.example.hello-1.0.0.nspkg
version = 1.0.0
version_code = 1
category = Developer
publisher = Nervus-OS
launch = hello_app
summary = The SDK sample app: a Compose window that calls an interface through the kernel.
description = Built from nervus-app-example. Start here when writing your own NervusOS app: it shows the manifest, the nspkg packaging and signing, and a NervusApp with a Compose UI.
