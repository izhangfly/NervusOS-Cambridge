# Installed as /etc/systemd/system/nervud.service.d/10-display.conf
#
# Hosted mode: NervusOS runs as a session on top of the Ubuntu desktop. nervud is
# not started at boot; nervus-session starts it after it has opened display :7.
[Unit]
Wants=nervus-piper.service

[Service]
Environment=DISPLAY=:7
Environment=XAUTHORITY=/run/nervus-x11/xauth
# Power off / restart inside NervusOS end or restart the session, never the laptop
Environment=NERVUS_HOSTED_POWER_HOOK=/usr/libexec/nervus/hosted-power
