syntax = "proto3";

package nervus.ipc.v2;

option go_package = "github.com/Nervus-OS/nervus-ipc/go/v2;nervusipc";

// ============================================================================
// Top-level Envelope
// ============================================================================

// Envelope is the only top-level message on the control plane.
// One frame carries exactly one Envelope.
message Envelope {
  // Protocol version number, same as NervusOS API version.
  // The kernel checks if it is supported; if not, the connection is rejected.
  uint32 protocol_version = 1;
  
  oneof body {
    // Call-related messages (30-32)
    Request request = 30;
    Response response = 31;
    Cancel cancel = 32;

    // Subscription and event messages (40-41, 53)
    Subscribe subscribe = 40;
    SubscribeResult subscribe_result = 41;
    PublishEvent publish_event = 53;

    // Keep-alive messages (60-61)
    Ping ping = 60;
    Pong pong = 61;
  }
}

// ============================================================================
// Call Messages (Request/Response/Cancel)
// ============================================================================

// Request message for initiating a call.
message Request {
  // Request ID, a UUID randomly generated by the caller.
  // Each Request has at most one terminal Response.
  string request_id = 1;
  
  // Target service ID (component ID).
  // The kernel routes the call to the corresponding service based on this field.
  string target_service = 2;
  
  // Method ID specifying which method to call.
  string method = 3;
  
  // Serialized method request parameters (format defined by the service).
  bytes payload = 4;
  
  // List of caller component permissions.
  // This field MUST be empty from the caller; it is filled by the kernel during forwarding.
  // The kernel queries the component identity via Unix Domain Socket peer UID and fills
  // the custom permissions the caller holds that are declared by the target service
  // through permission_additions.
  repeated string caller_permissions = 5;
}

// Response message returning the call result.
message Response {
  // Corresponding request ID.
  string request_id = 1;
  
  oneof outcome {
    Success success = 2;
    Failure failure = 3;
  }
}

// Cancel message for canceling an in-flight call.
message Cancel {
  // Request ID to cancel.
  // The Response for the canceled request carries a CANCELLED result.
  string request_id = 1;
}

// ============================================================================
// Subscription and Event Messages
// ============================================================================

// Subscribe message for subscribing to an event.
message Subscribe {
  // Request ID (subscriptions also have IDs).
  string request_id = 1;
  
  // Event ID to subscribe to, format: component_id.event.xxxx (reverse domain name format).
  string event_id = 2;
  
  // Subscription parameters (optional, defined by the service).
  bytes payload = 3;
  
  // List of caller component permissions.
  // This field MUST be empty from the caller; it is filled by the kernel during forwarding.
  // The target service can determine which permissions the caller holds and decide
  // whether to accept the subscription.
  repeated string caller_permissions = 4;
}

// SubscribeResult message indicating whether the subscription succeeded.
message SubscribeResult {
  // Corresponding subscription request ID.
  string request_id = 1;
  
  oneof outcome {
    Success success = 2;  // Subscription successful
    Failure failure = 3;  // Subscription failed (e.g., insufficient permissions: PERMISSION_DENIED)
  }
}

// PublishEvent message: Service pushes an event to the kernel.
// This is a one-way message with no result response.
message PublishEvent {
  // Event ID.
  string event_id = 1;
  
  // Event payload (event content, defined by the service).
  bytes payload = 2;
  
  // Visibility scope: determines which subscribers can receive the event.
  EventVisibility visibility = 3;
}

// EventVisibility defines the scope of event visibility.
enum EventVisibility {
  EVENT_VISIBILITY_UNSPECIFIED = 0;  // Invalid value, should not be used
  EVENT_VISIBILITY_PACKAGE = 1;      // Only same-package components receive the event
  EVENT_VISIBILITY_PUBLIC = 2;       // All subscribed components receive the event
}

// ListEventSubscribersRequest queries the current subscribers of an event.
// Calls the listEventSubscribers method of the kernel virtual service nervud.system.server.
message ListEventSubscribersRequest {
  // Event ID to query.
  string event_id = 1;
}

// EventSubscriber represents information about a single subscriber.
message EventSubscriber {
  // Subscriber component ID.
  string component_id = 1;
  
  // Subscriber package ID.
  string package_id = 2;
}

// ListEventSubscribersResponse returns the list of subscribers.
message ListEventSubscribersResponse {
  // All subscribers.
  repeated EventSubscriber subscribers = 1;
}

// ============================================================================
// Keep-alive Messages
// ============================================================================

// Ping message for probing peer liveness and measuring round-trip latency.
// Either side can initiate.
message Ping {
  // Nonce chosen by the initiator.
  uint64 nonce = 1;
}

// Pong message for replying to a Ping.
message Pong {
  // Nonce echoed from the initiator.
  uint64 nonce = 1;
}

// ============================================================================
// Common Result Types
// ============================================================================

// StatusCode describes the category of failure, not the specific cause.
enum StatusCode {
  STATUS_CODE_UNSPECIFIED = 0;  // Unspecified (invalid value)
  
  // Success codes (Success branch can only use these)
  STATUS_CODE_OK = 1;        // Call completed
  STATUS_CODE_ACCEPTED = 2;  // System has reliably received the creation request (does not indicate final success)
  
  // Failure codes (Failure branch can only use these)
  STATUS_CODE_INVALID_ARGUMENT = 3;      // Invalid argument
  STATUS_CODE_UNAUTHENTICATED = 4;       // Identity not established
  STATUS_CODE_PERMISSION_DENIED = 5;     // Permission denied
  STATUS_CODE_NOT_FOUND = 6;             // Target not found
  STATUS_CODE_FAILED_PRECONDITION = 7;   // Precondition not met
  STATUS_CODE_RESOURCE_EXHAUSTED = 8;    // Quota exhausted
  STATUS_CODE_DEADLINE_EXCEEDED = 9;     // Deadline exceeded
  STATUS_CODE_CANCELLED = 10;            // Cancelled
  STATUS_CODE_UNAVAILABLE = 11;          // Currently unavailable
  STATUS_CODE_INTERNAL = 12;             // Internal error
}

// Success represents a successful result.
message Success {
  // Success code (can only be OK or ACCEPTED).
  StatusCode code = 1;
  
  // Method-specific response data (type determined by the interface and method).
  bytes payload = 2;
}

// Failure represents a failed result.
message Failure {
  // Failure code (can only be failure category codes, >= 3).
  StatusCode code = 1;
  
  // Human-readable message for users.
  string public_message = 2;
  
  // Optional typed error detail (message type determined by the outer message).
  bytes error_detail = 3;
}