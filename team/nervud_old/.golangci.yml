version: "2"

linters:
  default: standard
  enable:
    - depguard
    - gochecknoglobals
  settings:
    depguard:
      rules:
        # This allowlist is the complete list of who may touch syscalls. Three places, and no more:
        #   authority: privileged operations (they change system state), audited by the Gate
        #   scheduler: its own mechanism (sched_setattr, needs CAP_SYS_NICE)
        #   sysprobe:  pure observation (changes no state); admission rules in its doc.go
        syscall-boundary:
          files:
            - "$all"
            - "!**/internal/authority/**"
            - "!**/internal/scheduler/**"
            - "!**/internal/sysprobe/**"
            - "!**/main.go"
          deny:
            - pkg: "syscall"
              desc: "Only authority/scheduler/sysprobe are allowed (main.go signal constants exception)"
            - pkg: "golang.org/x/sys"
              desc: "Only authority/scheduler/sysprobe are allowed"
            # os/exec is deliberately NOT allowed for sysprobe: starting a process is exercising power, not observing.
            - pkg: "os/exec"
              desc: "Only authority is allowed"
        no-testing-in-prod:
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: "testing"
              desc: "Production code must not import testing (no testing.Testing() branches / test hooks in the shipped binary)"
