syntax = "proto3";

package gz.msgs;

option go_package = "github.com/nervus-os/nervus-gazebo-provider/internal/gzmsgs;gzmsgs";

// This is a wire-compatible subset of Gazebo Msgs 12. It intentionally keeps
// only fields used by the Provider. Unknown upstream fields remain safely
// skippable under protobuf wire rules.

message Empty {
  bool unused = 1;
}

message Boolean {
  bool data = 2;
}

message Double {
  double data = 2;
}

message Time {
  int64 sec = 1;
  int32 nsec = 2;
}

message WorldReset {
  bool all = 2;
  bool time_only = 3;
  bool model_only = 4;
}

message WorldControl {
  bool pause = 2;
  bool step = 3;
  uint32 multi_step = 4;
  WorldReset reset = 5;
}

message WorldStatistics {
  Time sim_time = 2;
  Time real_time = 4;
  bool paused = 5;
  uint64 iterations = 6;
  int32 model_count = 7;
  double real_time_factor = 9;
  bool stepping = 11;
}

message Axis {
  double limit_lower = 3;
  double limit_upper = 4;
  double position = 10;
  double velocity = 11;
}

message Joint {
  enum Type {
    REVOLUTE = 0;
    REVOLUTE2 = 1;
    PRISMATIC = 2;
    UNIVERSAL = 3;
    BALL = 4;
    SCREW = 5;
    GEARBOX = 6;
    FIXED = 7;
    CONTINUOUS = 8;
  }

  string name = 2;
  uint32 id = 3;
  Type type = 4;
  Axis axis1 = 10;
  Axis axis2 = 11;
}

message Link {
  uint32 id = 2;
  string name = 3;
  bool canonical = 15;
}

message Model {
  string name = 2;
  uint32 id = 3;
  bool is_static = 4;
  repeated Joint joint = 6;
  repeated Link link = 7;
  bool deleted = 8;
  repeated Model model = 12;
}

message Scene {
  string name = 2;
  repeated Model model = 9;
  repeated Joint joint = 11;
}
