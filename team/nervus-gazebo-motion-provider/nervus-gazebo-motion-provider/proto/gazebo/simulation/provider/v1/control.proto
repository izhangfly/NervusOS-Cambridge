enum ControlEvent {
  CONTROL_EVENT_UNSPECIFIED = 0;

  CONTROL_EVENT_JOINT_STATE_CHANGED = 1 [(nervus.ipc.v1.event_meta) = {
    event_id: 1
    required_permission: "gazebo.simulation.motion.provider.permission.query"
    risk_class: RISK_CLASS_NORMAL
    delivery_class: DELIVERY_CLASS_STATE
    payload_type: "gazebo.simulation.motion.provider.v1.JointState"
    max_payload_bytes: 65536
    max_events_per_second: 20
  }];

  CONTROL_EVENT_COMMAND_REJECTED = 2 [(nervus.ipc.v1.event_meta) = {
    event_id: 2
    required_permission: "gazebo.simulation.motion.provider.permission.control"
    risk_class: RISK_CLASS_NORMAL
    delivery_class: DELIVERY_CLASS_RELIABLE
    payload_type: "gazebo.simulation.motion.provider.v1.CommandRejected"
    max_payload_bytes: 16384
    max_events_per_second: 20
  }];
}

enum WorldResetMode {
  WORLD_RESET_MODE_UNSPECIFIED = 0;
  WORLD_RESET_MODE_ALL = 1;
  WORLD_RESET_MODE_TIME_ONLY = 2;
  WORLD_RESET_MODE_MODELS_ONLY = 3;
}

message PauseRequest {
  uint64 world_generation = 1;
}

message ResumeRequest {
  uint64 world_generation = 1;
}

message StepRequest {
  uint64 world_generation = 1;
  uint32 iterations = 2;
}

message ResetWorldRequest {
  uint64 world_generation = 1;
  WorldResetMode mode = 2;
}

message WorldControlResult {
  SimulationStatus status = 1;
}

message JointPositionCommand {
  string model = 1;
  string joint = 2;
  uint32 axis = 3;
  double position = 4;
}

message SetJointPositionRequest {
  uint64 world_generation = 1;
  JointPositionCommand command = 2;
}

message SetJointPositionsRequest {
  uint64 world_generation = 1;
  repeated JointPositionCommand commands = 2;
}

// JointCommandReceipt confirms bounded validation and submission to Gazebo
// Transport. It does not claim that the physical simulation reached the target.
message JointCommandReceipt {
  uint64 world_generation = 1;
  uint64 command_sequence = 2;
  uint32 submitted_commands = 3;
  bool feedback_available = 4;
}

message JointTrajectoryPoint {
  repeated double positions = 1;
  int64 time_from_start_nanos = 2;
}

message SetJointTrajectoryRequest {
  uint64 world_generation = 1;
  string model = 2;
  string joint_group = 3;
  repeated JointTrajectoryPoint points = 4;
}

message GoHomeRequest {
  uint64 world_generation = 1;
  string model = 2;
  string joint_group = 3;
  string home_state = 4;
}

message StopMotionRequest {
  uint64 world_generation = 1;
  string model = 2;
  string joint_group = 3;
}

message StopAllMotionRequest {
  uint64 world_generation = 1;
}

message JointMotionReceipt {
  uint64 world_generation = 1;
  uint64 command_sequence = 2;
  uint64 motion_id = 3;
  uint32 controlled_joints = 4;
  bool accepted = 5;
  bool feedback_available = 6;
  bool converged = 7;
}

message CommandRejected {
  uint64 world_generation = 1;
  uint64 command_sequence = 2;
  uint32 command_index = 3;
  SimulationErrorReason reason = 4;
  string model = 5;
  string joint = 6;
  uint32 axis = 7;
}
