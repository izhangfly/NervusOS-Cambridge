name: Gradle PR checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nervus-system-software
        uses: actions/checkout@v7
        with:
          path: nervus-system-software

      - name: Checkout current nervus-app-sdk
        uses: actions/checkout@v7
        with:
          repository: Nervus-OS/nervus-app-sdk
          ref: master
          path: nervus-app-sdk

      - name: Checkout current nervus-packaging
        uses: actions/checkout@v7
        with:
          repository: Nervus-OS/nervus-packaging
          ref: master
          path: nervus-packaging

      - name: Checkout current nervus-ipc
        uses: actions/checkout@v7
        with:
          repository: Nervus-OS/nervus-ipc
          ref: master
          path: nervus-ipc

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        working-directory: nervus-system-software
        run: bash ./gradlew check "-Pnervus.abi=linux-x86_64" --no-daemon
