org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
kotlin.code.style=official

# Default target ABI. Override on the command line with -Pnervus.abi=...
# arm64 by default because the shipping target is a real board (RK3588); pass linux-x86_64 for a PC build
nervus.abi=linux-arm64
