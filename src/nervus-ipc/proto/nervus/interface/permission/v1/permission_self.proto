// Nervus standard interface · PermissionSelf@1  [REWRITE-v1 / experimental]
//
// [KERNEL: BUILTIN] implemented inside nervud (internal/permissionadmin).
//
// interface_id = nervus.interface.permission.self, major = 1, experimental.
//   Implementer = nervud (built into the kernel)
//   Permission  = **none** (see below)
//
// # What it is
//
// The "do I have this permission?" self-check interface, the equivalent of Android's `checkSelfPermission`:
// before calling a method that needs a sensitive permission, an app asks first, requests it if not
// (permission.ui's RequestPermission), and calls once it has it.
//
// # Why it has to be a separate interface_id
//
// It can't be a method on `permission.admin`: that interface's interface-level bar is
// `perm.permission.admin` itself (SYSTEM_ONLY + platform-release signature), so ordinary apps
// can't even Resolve it. And self-checking is exactly what **every app must be able to do**.
//
// In the Catalog's model one interface_id maps to a set of endpoint candidates, and one interface_id
// can only have one bar; different bars need two interfaces. The naming follows the camera /
// camera.config shape: two faces of the same domain.
//
// # Why no required_permission
//
// **Self-checking isn't a privilege.** It only answers "do I myself have X", and the caller is entitled to know its own
// authorisation state anyway: it can always try calling that method and get the same answer from
// PERMISSION_DENIED, only at much greater cost (a call doomed to fail,
// and for methods with side effects you can't try it that way at all).
//
// The consequence of adding a permission: if that permission were USER_CONSENT itself, you'd get the loop "you need the permission
// to check whether you have permissions"; if it were NORMAL, everyone would have it, and adding it would only
// put one more line of noise in every app's manifest.
//
// # Boundary: you can only check yourself
//
// The request has **no package_id field**, on purpose. The target package is always the caller itself, which the kernel takes from
// the Dispatch's caller (internal/endpoint's BuiltinCall.Caller, the identity recognised by SO_PEERCRED,
// not something self-reported in the request).
//
// With a package_id field it would be a "check any package's grant state" interface, which belongs to
// permission.admin (`perm.permission.admin` + SYSTEM_ONLY) and shouldn't exist without a bar.
// The permission layout is reconnaissance: knowing which app on which machine has the camera is directly valuable
// to an attacker.
//
// [REWRITE-v1] experimental: destructive changes allowed before freezing (NRCP §22.6).
// Compatibility rules (§10.12, effective once frozen): published method_ids and field numbers are never reused;
// deletions become reserved; new fields need safe defaults; enums start with *_UNSPECIFIED = 0 and fail closed.

syntax = "proto3";

package nervus.interface.permission.v1;

import "nervus/ipc/v1/method_registry.proto";
// GrantState uses the same enum as permission.admin. The states the self-check sees must be the same set of values as
// the permission management UI sees, otherwise "Settings shows refused" and "the app's self-check says not requested" would both
// hold while describing the same fact.
import "nervus/interface/permission/v1/permission.proto";

option go_package = "github.com/nervus-os/nervus-ipc/protocol/interface/permissionv1;permissionv1";

// Hyphens are illegal in Java package names, and "interface" is a Java reserved word, so the "iface" segment is used.
option java_package = "io.github.nervusos.iface.permission.v1";
option java_multiple_files = true;
option java_outer_classname = "PermissionSelfProto";

// =============================================================================
// method_id enum + Method Registry metadata
// =============================================================================

enum PermissionSelfMethod {
  PERMISSION_SELF_METHOD_UNSPECIFIED = 0;

  // Check your own grant state for a batch of permissions.
  //
  // Several can be asked at once: an app usually checks all the sensitive permissions it requested at start-up, and one call
  // per permission would make the cost of "checking permissions" grow with the number of permissions, on every cold start.
  // Batching also guarantees one answer comes from one Catalog revision; asking several times could get
  // mixed results across revisions.
  //
  // An empty list gets an empty list, not an error: an app that requests no sensitive permission can still call it
  // (usually generic start-up code that doesn't care how many permissions there are).
  PERMISSION_SELF_METHOD_CHECK = 1 [(nervus.ipc.v1.method_meta) = {
    method_id: 1
    required_permission: ""
    risk_class: RISK_CLASS_NORMAL
    requires_control_lease: false
    returns_operation: false
    needs_user_confirmation: false
    is_read_only: true
    is_motion: false
    request_type: "nervus.interface.permission.v1.CheckSelfPermissionRequest"
    response_type: "nervus.interface.permission.v1.CheckSelfPermissionResult"
    error_detail_type: ""
  }];
}

// =============================================================================
// Messages
// =============================================================================

// CheckSelfPermissionRequest asks "what state am I in for each of these permissions".
//
// **No package_id field**: the target is always the caller itself; see the "Boundary" section in the file header.
message CheckSelfPermissionRequest {
  // The permission IDs to check. Duplicates are de-duplicated, and unknown IDs still get a result
  // (granted=false, requestable=false) rather than failing the whole call;
  // one misspelt permission name shouldn't stop the app from checking the others.
  repeated string permission_ids = 1;
}

// CheckSelfPermissionResult answers each one.
//
// The order is independent of the request (sorted by permission ID); callers should index by permission_id rather than by
// position, because once duplicates in the request are removed, positions no longer line up.
message CheckSelfPermissionResult {
  repeated SelfPermissionState states = 1;
}

// SelfPermissionState is a permission's current state for the caller itself.
message SelfPermissionState {
  string permission_id = 1;

  // Can it be used right now. **This is the only field an app should branch on.**
  //
  // It's equivalent to the kernel's AllowedAt conclusion, which already combines three things: whether it's in the install-time grant
  // set, which grant mode tier it is, and (only for USER_CONSENT) whether the runtime state is
  // GRANTED. An app inferring from state itself would miss the first two: a NORMAL permission's
  // state is always UNSPECIFIED, yet it takes effect on install.
  bool granted = 2;

  // The runtime grant state. Only meaningful for the USER_CONSENT tier; UNSPECIFIED for the rest.
  //
  // It's given so apps can tell "never asked" from "the user explicitly refused"; the right
  // reactions are completely different: the former should make a request, the latter shouldn't (asking again only nags the user, and
  // DENIED_PERMANENT won't even show a dialog).
  GrantState state = 3;

  // Whether requesting still makes sense.
  //
  // false means RequestPermission is **bound to fail** for this one. Common reasons:
  // this package never requested it in its manifest, the install-time decision refused it (not enough trust / wrong signing role),
  // it isn't USER_CONSENT (NORMAL takes effect on install; PRIVILEGED/SYSTEM_ONLY are decided by origin and
  // signature, neither of which the user can change), or the user has refused permanently.
  //
  // **This field exists to break a real loop**: without it, an app seeing granted=false
  // can only request, and the request fails at once without changing granted, so it retries: a loop that starts
  // spinning at boot and may show a dialog every time.
  bool requestable = 4;
}
