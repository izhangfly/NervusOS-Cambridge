// Nervus standard interface · PackageManager@1  [REWRITE-v1 / experimental]
//
// [KERNEL: WIRED] nervud supports every mechanism this interface needs (Request/Response,
// Dispatch/DispatchResult, endpoint registration and routing). The interface-level permission perm.pkg.query
// protects resolution and read-only queries; every route also stacks the method-level required_permission on top, so
// installing, uninstalling and enabling/disabling components still need perm.pkg.install.
//
// interface_id = nervus.interface.pkg.manager, major = 1, experimental.
//   Implementer = nervus.pkgmanagerd (a system service, in the nervus-system-server repository)
//   Permission = perm.pkg.install / .query
//
// # Why it must be an Interface rather than a door opened directly by the kernel
//
// The authoritative install channel is nervud's root-only admin channel (nervud-admin.sock). An App can't
// be root and can't connect to that socket. So a system service running in the App UID range and explicitly admitted by the kernel
// is needed to forward for Apps, and the contract between Apps and that service is this interface.
//
// The division of labour must be remembered: this interface's implementer **makes no security decision**. Multi-role signature checks, digest re-checks,
// OEM countersignature admission, host ABI matching, upgrade decisions (downgrade protection + signing lineage continuity), the permission intersection,
// UID allocation and atomic commit all happen in nervud's pkgregistry. The Provider only delivers the request
// and reads the result back.
//
// # Why the risk level isn't PHYSICAL_CONTROL
//
// Installing drives no actuators and won't make the machine move, so is_motion = false and
// risk_class isn't PHYSICAL_CONTROL. But it's **certainly not** NORMAL: installing a package brings
// new executable code and new permission requests into the system, with consequences far more lasting than one motion command.
// So Install/Uninstall are RISK_CLASS_CRITICAL_SAFETY and need user confirmation;
// that's the fundamental difference in risk model between this interface and motion interfaces.
//
// [REWRITE-v1] experimental: destructive changes allowed before freezing (NRCP §22.6).
// Compatibility rules (§10.12, effective once frozen): published method_ids and field numbers are never reused;
// deletions become reserved; new fields need safe defaults; enums start with *_UNSPECIFIED = 0 and fail closed.

syntax = "proto3";

package nervus.interface.pkgmanager.v1;

import "nervus/ipc/v1/method_registry.proto";
// LocalizedText: the permission text Inspect returns to the confirmation screen. The kernel takes it from the Catalog's permission
// definitions, and the UI doesn't hard-code it: third-party packages can define their own permissions, and the UI can't know
// their names and descriptions in advance.
import "nervus/ipc/v1/provider_descriptor.proto";

option go_package = "github.com/nervus-os/nervus-ipc/protocol/interface/pkgmanagerv1;pkgmanagerv1";

// Hyphens are illegal in Java package names; see status.proto for why.
option java_package = "io.github.nervusos.iface.pkgmanager.v1";
option java_multiple_files = true;
option java_outer_classname = "PackageManagerProto";

// =============================================================================
// method_id enum + Method Registry metadata
// =============================================================================

enum PackageManagerMethod {
  PACKAGE_MANAGER_METHOD_UNSPECIFIED = 0;

  // Install a .nspkg.
  //
  // **A long task**: unpacking + a full digest re-check can take a while (a large package is tens of MiB),
  // far beyond an ordinary request/response deadline budget. So returns_operation = true,
  // answered with ACCEPTED + operation_id, with the terminal state queried separately.
  //
  // needs_user_confirmation = true: installing new executable code into the system must be gated by a **system-held**
  // confirmation dialog. Agents can only request, never confirm by themselves (the Agent document §4.3).
  PACKAGE_MANAGER_METHOD_INSTALL = 1 [(nervus.ipc.v1.method_meta) = {
    method_id: 1
    required_permission: "perm.pkg.install"
    risk_class: RISK_CLASS_CRITICAL_SAFETY
    requires_control_lease: false
    returns_operation: true
    needs_user_confirmation: true
    is_read_only: false
    is_motion: false
    request_type: "nervus.interface.pkgmanager.v1.InstallRequest"
    response_type: "nervus.interface.pkgmanager.v1.InstallResult"
    error_detail_type: "nervus.interface.pkgmanager.v1.PackageManagerErrorDetail"
  }];

  // Uninstall a dynamically installed Package.
  //
  // System image packages can't be uninstalled: nervud refuses with ErrSystemPackageImmutable (they follow
  // whole-image OTA). The Provider doesn't pre-judge this; it forwards directly and lets nervud give the refusal reason.
  //
  // Not an operation: uninstalling is stopping components + deleting directories + revoking permissions, quick at normal scale.
  PACKAGE_MANAGER_METHOD_UNINSTALL = 2 [(nervus.ipc.v1.method_meta) = {
    method_id: 2
    required_permission: "perm.pkg.install"
    risk_class: RISK_CLASS_CRITICAL_SAFETY
    requires_control_lease: false
    returns_operation: false
    needs_user_confirmation: true
    is_read_only: false
    is_motion: false
    request_type: "nervus.interface.pkgmanager.v1.UninstallRequest"
    response_type: ""
    error_detail_type: "nervus.interface.pkgmanager.v1.PackageManagerErrorDetail"
  }];

  // List installed Packages. Read-only; no confirmation dialog needed.
  PACKAGE_MANAGER_METHOD_LIST = 3 [(nervus.ipc.v1.method_meta) = {
    method_id: 3
    required_permission: "perm.pkg.query"
    risk_class: RISK_CLASS_NORMAL
    requires_control_lease: false
    returns_operation: false
    needs_user_confirmation: false
    is_read_only: true
    is_motion: false
    request_type: "nervus.interface.pkgmanager.v1.ListRequest"
    response_type: "nervus.interface.pkgmanager.v1.ListResult"
    error_detail_type: "nervus.interface.pkgmanager.v1.PackageManagerErrorDetail"
  }];

  // Disable/enable a Component.
  //
  // Components on the protected list (pkgmanagerd itself, settings, permissionui, sessiond,
  // safety.recovery) can't be disabled; that baseline is in the kernel's compile-time switch, not decided by the Provider.
  // Disabling them would cost the system its ability to repair itself.
  PACKAGE_MANAGER_METHOD_SET_COMPONENT_ENABLED = 4 [(nervus.ipc.v1.method_meta) = {
    method_id: 4
    required_permission: "perm.pkg.install"
    risk_class: RISK_CLASS_CRITICAL_SAFETY
    requires_control_lease: false
    returns_operation: false
    needs_user_confirmation: true
    is_read_only: false
    is_motion: false
    request_type: "nervus.interface.pkgmanager.v1.SetComponentEnabledRequest"
    response_type: ""
    error_detail_type: "nervus.interface.pkgmanager.v1.PackageManagerErrorDetail"
  }];

  // Read a .nspkg that **isn't installed yet**, returning its identity and the sensitive permissions it requests.
  //
  // # What gap it fills
  //
  // The install confirmation screen must lay out "this package wants the camera and microphone" for the user before installing. But a package that isn't
  // installed isn't in the Catalog: permission.admin's ListGrants and this interface's LIST
  // only cover **installed** packages, and nobody could say what a package about to be installed requests.
  //
  // # Why the kernel must do this rather than the confirmation screen reading it itself
  //
  // The confirmation screen holds perm.permission.admin, the only process in the system that can change grant state. Having it
  // untar, parse a manifest **not yet signature-checked** and look up the permission definition table would put a parser of untrusted content
  // into the most privileged process, the worst place on the attack surface for a parser.
  //
  // nervud has to unpack, verify and decide permissions by the Catalog for INSTALL anyway. Reading out those already
  // parsed facts comes for free, and parsing always stays on the kernel side.
  //
  // # How read-only it is
  //
  // **No state is written**: no Entry registered, no UID allocated, no Catalog change, nothing created outside
  // staging. The same package can be INSPECTed any number of times with the same result.
  //
  // The permission is perm.pkg.query rather than perm.pkg.install: reading what a package requests and being entitled to
  // install it are two different things. Settings-type apps can show "what permissions this package wants" without having install
  // capability.
  //
  // Not an operation: unpacking and verifying cost something, but it **doesn't wait for a person**; with no user interaction, an ordinary
  // deadline is enough. That's the opposite of permission.ui's ConfirmInstall, which waits for the user to
  // read the list and click.
  PACKAGE_MANAGER_METHOD_INSPECT = 5 [(nervus.ipc.v1.method_meta) = {
    method_id: 5
    required_permission: "perm.pkg.query"
    risk_class: RISK_CLASS_NORMAL
    requires_control_lease: false
    returns_operation: false
    needs_user_confirmation: false
    is_read_only: true
    is_motion: false
    request_type: "nervus.interface.pkgmanager.v1.InspectRequest"
    response_type: "nervus.interface.pkgmanager.v1.InspectResult"
    error_detail_type: "nervus.interface.pkgmanager.v1.PackageManagerErrorDetail"
  }];
}

// =============================================================================
// Messages
// =============================================================================

// InstallRequest asks to install a .nspkg.
message InstallRequest {
  // The .nspkg's relative path in the **user documents area** (user-data).
  //
  // # The hand-over directory is user-data, not the caller's private directory
  //
  // This used to say "the caller's private data directory", which was wrong: each package's private directory is 0700
  // and owned by that package's UID, so the Provider can't read into it. The protocol and the implementation meant two different places,
  // and **no install started by an App could ever succeed**: wherever the caller could write, the Provider couldn't read,
  // and wherever the Provider could read, the caller couldn't write.
  //
  // user-data rather than a new dedicated hand-over directory: it's already the "user files shared across packages"
  // area, where .nspkg files the user downloads or copies in land anyway, and where the file manager works.
  // Another one would only add a pure copy and buy no isolation (both are readable system-wide).
  //
  // **Deliberately not an absolute path.** An absolute path would let the caller name any location on the filesystem, while
  // the Provider runs in a ProtectSystem=strict sandbox, and an absolute path it can't read would only
  // get a vague "can't open". A relative path writes the hand-over location into the protocol itself.
  //
  // It must be a relative path without ".."; the Provider and nervud both check it again.
  string nspkg_relpath = 1;

  // The IDs of the sensitive permissions the user agreed to on the install confirmation screen.
  //
  // # What it solves
  //
  // USER_CONSENT permissions (perm.camera.capture and the like) can get into
  // GrantedPermissions at install time, but at run time AllowedAt requires GrantState == GRANTED, which defaults to
  // NOT_REQUESTED. In other words, once an ordinary app is installed, the sensitive permissions it requested can **never** be
  // obtained: the app can't help itself (the SDK has no API for requesting permissions), and the user has no UI to approve them. This field
  // lets the install fill that question in: before installing, the package's sensitive permissions are laid out for the user, and whichever
  // the user agrees to are stored directly as GRANTED once the install succeeds.
  //
  // # Who may fill it in
  //
  // **Only the system confirmation UI.** Installing over IPC must go through nervus.interface.permission.ui's
  // ConfirmInstall: INSTALL's needs_user_confirmation is true, and nervud's
  // gate only lets callers holding perm.permission.admin through, which in the whole system only
  // nervus.permissionui holds. So ordinary apps can't fill it in; they can't even call INSTALL.
  //
  // # The kernel filters it again
  //
  // nervud only stores the intersection of **consent list ∩ install-time grant set ∩ USER_CONSENT**,
  // silently ignoring out-of-bounds entries: a permission never requested, or not USER_CONSENT, appearing here
  // shouldn't become a real grant because the confirmation UI made a mistake. So this field is a statement of
  // "what the user agreed to", not a command of "please grant this".
  repeated string consented_permissions = 2;
  // The InspectResult.manifest_digest from the confirmation screen's INSPECT, passed back unchanged.
  //
  // # What it closes: "looked at A, installed B"
  //
  // The .nspkg sits in the user-data area shared across packages, so the caller could perfectly well swap the file between INSPECT and INSTALL.
  // Each call is legitimate on its own, and neither reveals anything when looked at alone,
  // while the user agreed based on A's permission list and consented_permissions would be applied to B.
  //
  // With it present the kernel compares; a mismatch is refused (PACKAGE_MANAGER_REASON_CONTENT_CHANGED).
  //
  // **Empty means no check.** It must be allowed to be empty: system setup scripts and deploy install packages directly and never have
  // an INSPECT step, and requiring it would break all of them. Every caller that has shown the user the permission list
  // **must** include it, otherwise that confirmation binds nothing.
  string expected_manifest_digest = 3;
}

// InstallResult is the terminal state of a successful install (the operation's result).
message InstallResult {
  PackageInfo package = 1;
}

// UninstallRequest asks to uninstall.
message UninstallRequest {
  string package_id = 1;
}

// ListRequest asks for the list of installed Packages.
//
// An empty message rather than omitting the request body: when filter conditions get added later (only user-installed, only from some source)
// there's somewhere to put them without a new method_id.
message ListRequest {}

// ListResult is the projection of installed Packages.
message ListResult {
  repeated PackageInfo packages = 1;
}

// SetComponentEnabledRequest disables/enables a Component.
message SetComponentEnabledRequest {
  string package_id = 1;
  string component_id = 2;
  bool enabled = 3;
}

// InspectRequest asks to read what a .nspkg **not yet installed** declares.
message InspectRequest {
  // The .nspkg's relative path. Exactly the same meaning as InstallRequest.nspkg_relpath,
  // with the same checks (no "..", not absolute).
  //
  // **Deliberately the same hand-over convention as InstallRequest**: the confirmation screen Inspects, then Installs,
  // and both must refer to the same file. If their path semantics differed, a "looked at A, installed B" gap would
  // open in between, while the permission list the user saw came from A.
  string nspkg_relpath = 1;
}

// InspectResult is a **read-only projection of the declarations** of a package to be installed.
//
// # Why the kernel must provide it
//
// The only place that knows "what this package requests" is the manifest in the package, which is untrusted content
// before signature checking. Having the confirmation screen unpack it, parse the manifest and look up the permission definition table would put
// a parser of untrusted content into a process holding perm.permission.admin, the worst place in the whole system
// for a parser.
//
// nervud has to unpack and verify on the install path anyway, so reading out "the parsed declarations" comes for free.
//
// # It isn't a rehearsal of the install decision
//
// This method **doesn't answer "can this package be installed"**: signatures, digests, ABI, downgrade protection and the permission intersection
// are all decided on the Install side, and the state those decisions depend on (installed versions, signing lineage) may change between
// Inspect and Install. Giving out decision results in advance would make callers think
// "Inspect passed = Install will succeed", which isn't true.
message InspectResult {
  // The identity the package claims. From the manifest, **signature-checked** but not yet through the install decision.
  string package_id = 1;
  string version = 2;
  uint64 version_code = 3;

  // The sensitive permissions this package requests that need the user's agreement.
  //
  // **Already filtered by the kernel to the USER_CONSENT tier**: other grant modes have no question of "agree or not";
  // NORMAL takes effect on install, PRIVILEGED / SYSTEM_ONLY are decided by origin and signature.
  // Mixing them in would only make the confirmation screen show a pile of entries the user has no choice about.
  //
  // An empty list is common and normal: for a package requesting no sensitive permission, the confirmation screen only has to ask
  // "install or not".
  repeated RequestedPermission consent_permissions = 4;
  // A digest of the content seen this time, for binding INSTALL.
  //
  // The confirmation screen **must** put it unchanged into InstallRequest.expected_manifest_digest,
  // otherwise the permission list the user saw and the package actually installed may not be the same copy, and the swap in between
  // would leave no trace.
  //
  // It's the hex string of sha256(the raw manifest bytes). The manifest contains every file's
  // digest and is itself covered by the signature, so it identifies the whole package content, with no need to walk the file tree.
  string manifest_digest = 5;
}

// RequestedPermission is one sensitive permission a package to be installed requests.
//
// Deliberately the same shape as permission.v1.PermissionGrant (ID + localised text + risk level),
// except there's **no state** here: the package isn't installed, so there's no runtime grant state yet.
// The same shape lets the confirmation screen and the permission management screen share one rendering path.
message RequestedPermission {
  string permission_id = 1;

  // The user-facing name and description, from the Catalog's permission definition.
  //
  // **Supplied by the kernel rather than hard-coded in the UI**: third-party packages can define their own permissions,
  // and the UI can't know their text in advance.
  nervus.ipc.v1.LocalizedText display_name = 2;
  nervus.ipc.v1.LocalizedText description = 3;

  nervus.ipc.v1.RiskClass risk_class = 4;
}

// PackageInfo is an installed Package's **outward projection**.
//
// Deliberately excluded: the install path, UID, signing keys and digest list. Those are kernel-internal state,
// and leaking them would only help attackers locate targets (compare ResolveEndpointSuccess's
// resource_handle: no Provider PID, device node or serial number).
message PackageInfo {
  string package_id = 1;
  string version = 2;
  uint64 version_code = 3;

  // The string projection of the trust profile (ordinary / oem / platform).
  // A string rather than reusing the ipcv1.TrustProfile enum: it's for UI display,
  // takes part in no decision, and isn't worth adding a dependency on a control-plane enum at the interface layer.
  string trust = 4;

  // Origin: system-image / dynamic-install.
  string source = 5;

  // The IDs of granted permissions, for UI display. A read-only projection of nervud's decision.
  repeated string granted_permissions = 6;

  // The IDs of disabled Components.
  repeated string disabled_components = 7;
}

// =============================================================================
// Detailed error causes
// =============================================================================

// PackageManagerErrorDetail is this interface's fixed detail type on failure.
//
// Why it's needed: install failure reasons **mean something** to users: wrong signature, version downgrade,
// ABI mismatch and package already exists each need a completely different response (use another package / don't install the old version /
// get a package for the other architecture / uninstall first). A blanket FAILED_PRECONDITION would let the UI only show
// "install failed", pushing all the troubleshooting onto the user.
message PackageManagerErrorDetail {
  PackageManagerReason reason = 1;
}

enum PackageManagerReason {
  // Fail closed: unknown reasons are handled most conservatively (no retry, suggest contacting the publisher).
  PACKAGE_MANAGER_REASON_UNSPECIFIED = 0;

  // Signature verification failed or a required signing role is missing (dynamic installs must have a developer signature).
  PACKAGE_MANAGER_REASON_SIGNATURE_INVALID = 1;

  // The digest re-check failed: the package content doesn't match the manifest's declarations (corrupted or tampered with).
  PACKAGE_MANAGER_REASON_DIGEST_MISMATCH = 2;

  // version_code isn't higher than the installed version, refused by downgrade protection.
  PACKAGE_MANAGER_REASON_DOWNGRADE = 3;

  // The package's supported_abis don't intersect this machine's ABI.
  PACKAGE_MANAGER_REASON_ABI_MISMATCH = 4;

  // The manifest structure is illegal (schema version, required fields, path escapes and so on).
  PACKAGE_MANAGER_REASON_MANIFEST_INVALID = 5;

  // The target Package doesn't exist (when uninstalling/disabling).
  PACKAGE_MANAGER_REASON_PACKAGE_NOT_FOUND = 6;

  // System image packages can't be uninstalled, or the Component is on the protected list and can't be disabled.
  PACKAGE_MANAGER_REASON_IMMUTABLE = 7;

  // The signing lineage is discontinuous on upgrade: the new package wasn't signed by the same developer (or their authorised successor key).
  // This stops "hijacking an installed app's identity with a package of the same name".
  PACKAGE_MANAGER_REASON_LINEAGE_BROKEN = 8;

  // Unpacking failed: a bad compression format, or an entry trying to escape the target directory (tar-slip).
  PACKAGE_MANAGER_REASON_ARCHIVE_INVALID = 9;

  // The package content was swapped after the user confirmed: expected_manifest_digest doesn't match.
  //
  // **It's a different thing from DIGEST_MISMATCH.** That one is "the package is broken or tampered with" (the content doesn't match its own
  // manifest declarations); with this one the package may be perfectly valid and correctly signed, it just isn't the copy the confirmation screen
  // laid out for the user. The former should prompt the user to download again, the latter must go through confirmation again;
  // merging them would make the UI give the wrong remedy.
  PACKAGE_MANAGER_REASON_CONTENT_CHANGED = 10;
}
