name: Protocol PR checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nervus-ipc
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test ./... -race

  jvm:
    name: JVM build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nervus-ipc
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        working-directory: jvm
        run: bash ./gradlew check --no-daemon
