# journald configuration for Nervus OS.
#
# Installed as /etc/systemd/journald.conf.d/10-nervus.conf.
#
# [Why a drop-in rather than editing /etc/systemd/journald.conf]
#
# Two reasons, both needed:
#
#  1. Raspberry Pi OS bookworm (images after 2025-05-13) sets Storage=volatile [explicitly]
#     in the main file. Creating /var/log/journal alone does nothing: that only works with
#     Storage=auto, and the explicit value in the main file overrides auto. A drop-in
#     takes precedence over the main file and wins.
#
#  2. The main file belongs to the distribution's systemd package; editing it causes conflicts on upgrade.
#
# [Why every value is set explicitly instead of left at its default]
#
# journald's default size is "10% of the filesystem, capped at 4 G", so a bigger SD card
# automatically means more writing and faster wear. Tying log policy to storage size makes no sense.

[Journal]

# On disk, not in memory.
#
# [persistent must be explicit; auto won't do]: see reason 1 above.
# Without it everything before a reboot is lost, and the moment a robot most needs its logs is
# "it just rebooted by itself".
Storage=persistent

Compress=yes

# No syslog daemon is installed, so forwarding would just write every entry twice.
ForwardToSyslog=no

# ---- size ----
#
# 500 MB in total. SystemKeepFree is a second limit: the smaller of the two wins, so even on a small card
# journald won't fill the disk.
SystemMaxUse=500M
SystemKeepFree=500M

# 64 MB per file: 500 MB is cut into about 8 files.
#
# Too big and each cleanup drops a large slice of history at once; too small and journalctl slows down with many files.
SystemMaxFileSize=64M

# Logs older than a month are no use for debugging; reclaim by age first instead of waiting for 500 MB.
MaxRetentionSec=1month

# ---- sync interval ----
#
# Keep systemd's default of 5 minutes. Power loss costs at most 5 minutes of [ops logs].
#
# [The security audit doesn't depend on this]: nervud's audit chain manages its own fsync (a 1-second window, and
# denials are written immediately) under /var/lib/nervus/audit, separate from the journal.
# Lowering this only buys SD card write amplification, not audit durability.
#
# Also, journald syncs CRIT/ALERT/EMERG messages [immediately and unconditionally],
# regardless of this setting, so the messages that really matter never wait 5 minutes.
SyncIntervalSec=5min

# ---- rate limiting ----
#
# The default is 10000 messages per service per 30 seconds; anything over is [silently dropped].
#
# Loosened rather than switched off: off would let one noisy component flush all 500 MB in minutes
# and push everyone else's history out. nervud's own exemption is given separately in nervud.service's
# LogRateLimitIntervalSec=0, so only the TCB gets that, not everyone.
RateLimitIntervalSec=30s
RateLimitBurst=20000
